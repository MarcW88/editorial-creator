<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editorial Creator</title>
  <meta name="description" content="Pilotage local et vérifiable des workflows éditoriaux.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <a class="identity" href="/">Editorial Creator</a>
    <div id="health" class="health">Diagnostic en cours…</div>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow">Atelier éditorial local</p>
      <h1>Un workflow qui ne saute aucune étape.</h1>
      <p>Chaque skill est chargé depuis un commit verrouillé, exécuté séparément et contrôlé avant que la suite ne soit accessible.</p>
    </section>

    <section class="onboarding" aria-labelledby="onboarding-title">
      <div><p class="section-number">Nouveau site</p><h2 id="onboarding-title">Connecter un dépôt</h2></div>
      <form id="site-form">
        <label>Chemin local ou dépôt GitHub<input name="source" placeholder="/Users/marc/mon-site ou https://github.com/organisation/depot" required></label>
        <label>Langue<input name="language" placeholder="fr-FR" required></label>
        <label>Thématique<input name="topic" placeholder="Sujet principal du site" required></label>
        <button type="submit">Inspecter et valider le profil</button>
        <div id="site-message"></div>
      </form>
    </section>

    <section id="setup" class="setup" aria-labelledby="setup-title">
      <div>
        <p class="section-number">Nouveau dossier</p>
        <h2 id="setup-title">Préparer un guide</h2>
      </div>
      <form id="run-form">
        <label>Profil éditorial<select id="site-profile" name="siteProfile"><option value="bloc-notes-numerique">Bloc-notes numériques · FR</option></select></label>
        <label>Chemin local du site<input name="sitePath" value="/Users/marc/bloc-notes-numerique" required></label>
        <label class="full">URL(s) ou slug(s), une valeur par ligne<textarea name="target" rows="3" placeholder="/guides/exemple/" required></textarea></label>
        <label>Opération<select name="operation"><option value="audit-update">Auditer puis actualiser</option><option value="create">Créer un nouveau contenu</option></select></label>
        <label>Mode d’exécution<select name="executionMode"><option value="manual">Étape par étape avec validations</option><option value="automatic">Tout exécuter automatiquement</option></select></label>
        <label>Workflow éditorial<select name="contentType"><option value="auto">Détecter depuis l’URL</option><option value="guide">Guide / article informationnel</option><option value="comparison">Comparatif / sélection</option><option value="brand">Marque / produit</option><option value="usage">Usage / besoin</option><option value="deal">Bons plans</option><option value="trust">Confiance / institutionnel</option></select></label>
        <label>Consigne éditoriale<textarea name="request" rows="3" placeholder="Objectif, données disponibles, contraintes…"></textarea></label>
        <button type="submit">Créer l’exécution</button>
      </form>
    </section>

    <div id="batch-status" hidden></div>
    <section id="workspace" class="workspace" hidden>
      <nav aria-label="Étapes du workflow"><button id="new-run" class="secondary new-run">Nouvelle exécution</button><ol id="steps" class="steps"></ol></nav>
      <article id="step-detail" class="step-detail"></article>
    </section>
  </main>
  <script type="module" src="/app.js?v=10"></script>
</body>
</html>
